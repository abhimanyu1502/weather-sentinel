name: CI - Build & Test Suite

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ----------------------------------------------------------------------------
  # Backend Testing & Physics Validation
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Validation (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Core Physics, Fusion & ML Inference Validation
        working-directory: backend
        run: |
          python tests/validation/run_all_checks.py

      - name: Run Pytest Unit Tests
        working-directory: backend
        run: |
          pytest tests/unit

  # ----------------------------------------------------------------------------
  # Frontend TypeScript & Production Bundle Verification
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Type Check (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Type Check & Production Bundle Build
        working-directory: frontend
        run: |
          npm run build
