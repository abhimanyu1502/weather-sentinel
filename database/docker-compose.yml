version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: stormsentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stormsentinel
      POSTGRES_USER: weather_admin
      POSTGRES_PASSWORD: stormsentinel_secure_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_admin -d stormsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stormsentinel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
