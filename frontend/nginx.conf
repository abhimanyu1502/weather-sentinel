server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/geo+json;

    # Static Assets & GeoJSON caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|geojson)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA History API Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
